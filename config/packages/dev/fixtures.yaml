parameters:
    # Which hospitals receive synthetic allocations: single, minimal, medium, realistic or large (see fixtures.profiles).
    env(FIXTURES_PROFILE): 'medium'
    fixtures.profile: '%env(FIXTURES_PROFILE)%'

    # Multiplies the allocations per day (0.01–10); 1 is close to real volumes, 0.1 loads fast.
    env(FIXTURES_SCALE): '1'
    fixtures.scale: '%env(float:FIXTURES_SCALE)%'

    # Last day of the generated period (Y-m-d); empty means yesterday. A fixed date gives a fixed dataset.
    env(FIXTURES_UNTIL): ''
    fixtures.until: '%env(FIXTURES_UNTIL)%'

    # Whole months before the month of the last day; empty uses the months of the preset or the baseline.
    env(FIXTURES_MONTHS): ''
    fixtures.months: '%env(FIXTURES_MONTHS)%'

    # Reference package (JSON, for example a private catalog in var/reference/) whose catalog replaces the
    # synthetic one, except states, dispatch areas and hospitals, which stay synthetic. Empty: synthetic only.
    env(FIXTURES_REFERENCE_PACKAGE): ''
    fixtures.reference_package: '%env(FIXTURES_REFERENCE_PACKAGE)%'

    # Mapping file (JSON) that binds the generator's names to a catalog that spells them differently. Empty: none.
    env(FIXTURES_CATALOG_MAPPING): ''
    fixtures.catalog_mapping: '%env(FIXTURES_CATALOG_MAPPING)%'

    # Active hospitals per size; "any" draws hospitals of any size with the seed.
    # The demo user foo owns one of the active hospitals, drawn with the seed.
    # "scenarios" lays scenarios over the data: name → applications per year (at least one in the period),
    # placed with the seed (flu wave and icy road in winter, an MCI spread over 2–4 hospitals).
    # "closure_share" sets the share of closed department-hours for every hospital of the preset (0 to below 1);
    # without it each hospital gets the share of its size from the structural patterns (5/8/10 %). The small
    # presets close little, so they load fast; an explicit share of a ProfileSelection still wins.
    fixtures.profiles:
        single: { any: 1, closure_share: 0.01 }
        minimal: { Large: 1, Medium: 1, Small: 1, closure_share: 0.01 }
        medium: { Large: 2, Medium: 2, Small: 2, closure_share: 0.01, scenarios: { mci: 1 } }
        realistic: { Large: 3, Medium: 6, Small: 6, scenarios: { flu-wave: 1, mci: 1 } }
        # Every participating hospital of the synthetic catalog, two years.
        large: { Large: 3, Medium: 8, Small: 9, months: 24, scenarios: { flu-wave: 1, mci: 1, icy-road: 0.5 } }

    fixtures.baseline:
        # Whole months before the month of the last day; with yesterday in October 2026, 12 means 1 October 2025 until yesterday.
        months: 12
        # Average allocations per hospital and day by hospital size (coarse, rounded from real volumes).
        allocations_per_day:
            Small: 10
            Medium: 15
            Large: 40
        # Expected MCI cases per active hospital and year (Poisson distributed per month).
        mci_cases_per_hospital_and_year: 2
        # Yearly growth of the daily rate (0.02 = 2 %), relative to 2026-01-01; 0 is off.
        trend_per_year: 0.02
        seed: 740
        rebuild_projection: true
