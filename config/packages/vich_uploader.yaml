vich_uploader:
    db_driver: orm

    mappings:
        media:
            uri_prefix: /uploads/media
            upload_destination: '%kernel.project_dir%/public/uploads/media'
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
            delete_on_update: true
            delete_on_remove: true

# Demo environment (ADR 023): media of the demo stay apart from dev uploads.
when@demo:
    vich_uploader:
        mappings:
            media:
                uri_prefix: /uploads/demo/media
                upload_destination: '%app.media_upload_dir%'
