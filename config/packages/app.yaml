parameters:
    app.default.title: 'Collaborative IVENA statistics'
    env(APP_CONTENT_DEFAULT_LOCALE): 'en'

app:
    title: '%env(default:app.default.title:APP_TITLE)%'
    short_title: 'COIS'
    blog:
        title: 'Our Blog'
        description: 'Updates, Backgrounds and News about Collaborative IVENA Statistics.'

    default_locale: 'en'

    content:
        # Editorial/CMS fallback locale (independent of UI default_locale). Set APP_CONTENT_DEFAULT_LOCALE=de in production.
        default_locale: '%env(APP_CONTENT_DEFAULT_LOCALE)%'

    import:
        reject_writer: 'db'
        csv_reject_dir: 'var/import_rejects'
    meta:
        copyright_start_year: 2025
        hoster:
            name: 'Uberspace'
            url: 'https://uberspace.de'

    registration:
        # Domain suffixes (exact domain or TLD). Leading dots are optional (.ru and ru are equivalent).
        # Matching is case-insensitive and label-based: example.ru and sub.example.ru match .ru,
        # but pru.com / russia.com / ru.example.com do not.
        blocked_email_domains:
            - .ru

    closure_volume:
        reference_weeks_before: 4
        reference_weeks_after: 4
        minimum_reference_slots: 4

    # Thresholds per background job run (ADR 018) and expected interval of scheduler jobs (ADR 019);
    # jobs without values only record their runs.
    # Measured 2026-10-25 on the development data (docs/05-operations/observability-sentry.md, "Measured runs").
    job_runs:
        allocation_import:
            slow_seconds: 120
            long_seconds: 900
            memory_mb: 200
        closure_import:
            slow_seconds: 120
            long_seconds: 600
            memory_mb: 200
        allocation_projection_rebuild:
            slow_seconds: 30
            long_seconds: 300
            memory_mb: 200
        allocation_projection_full_rebuild:
            slow_seconds: 600
            long_seconds: 1800
            memory_mb: 200
        closure_rebuild:
            slow_seconds: 1800
            long_seconds: 7200
            memory_mb: 200
            overdue_after_minutes: 120
        # Scheduler jobs (ADR 019): only the expected interval until measured runs give thresholds.
        kpi_daily:
            overdue_after_minutes: 420
        monthly_reminder:
            overdue_after_minutes: 1500
        analytics_aggregation:
            overdue_after_minutes: 1500
        notification_cleanup:
            overdue_after_minutes: 1500
        notification_reconcile:
            overdue_after_minutes: 120
        storage_measurement:
            overdue_after_minutes: 1500

    storage:
        # Usage in percent of the capacity reference at which each level starts (ADR 017).
        thresholds:
            notice_percent: 80
            warning_percent: 90
            critical_percent: 99
        measurement_max_age_hours: 36

    feedback:
        spam:
            min_submission_seconds: 4
            long_message_threshold: 1800
            max_message_length: 4000
            anonymous_threshold: 6
            authenticated_threshold: 8
            authenticated_score_bonus: 2
            keywords:
                - casino
                - crypto
                - loan
                - viagra
                - seo
                - backlink
                - guest post
                - cialis
                - forex
                - nft
                - weight loss
                - make money
                - click here
