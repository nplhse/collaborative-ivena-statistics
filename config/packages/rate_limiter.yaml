framework:
    rate_limiter:
        verify_email_resend:
            policy: fixed_window
            limit: 3
            interval: '15 minutes'
        explore_list:
            policy: fixed_window
            limit: 100
            interval: '10 minutes'
        feedback_submit:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        feedback_submit_anonymous_ip:
            policy: fixed_window
            limit: 4
            interval: '1 hour'
        feedback_submit_anonymous_email:
            policy: fixed_window
            limit: 3
            interval: '1 hour'
        transactional_mail:
            policy: sliding_window
            limit: 1
            interval: '3 seconds'
        register:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        # Mail to an existing account after a registration attempt with its email address (#936), per account.
        # Further attempts get the same answer but no mail.
        registration_attempt_notice:
            policy: fixed_window
            limit: 1
            interval: '24 hours'
        reset_password_request:
            policy: fixed_window
            limit: 10
            interval: '1 hour'
        # Codes entered in the two-factor settings (#1357) to switch it off or renew the backup codes, per user.
        two_factor_settings_code:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        # Codes entered at sign-in (/2fa/check), per account (#1691, TwoFactorFailureThrottlingListener). Every code
        # takes a token; only an accepted code resets it, a password login or login link does not. They also count
        # towards login_throttling (IP + username) in security.yaml, which a password login resets.
        two_factor_code:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Wrong passwords per account across all IPs (#1762, AccountLock). The 20th within an hour locks password and
        # login link sign-ins for AccountLock::LOCK_DURATION; unknown usernames count nothing.
        login_account_failure:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Login link requests (#1355): per IP and per entered identifier (hashed). Exceeding either sends no mail
        # but shows the same page as a successful request.
        login_link_request:
            policy: fixed_window
            limit: 5
            interval: '15 minutes'
        login_link_request_identifier:
            policy: fixed_window
            limit: 3
            interval: '15 minutes'
        import_create:
            policy: fixed_window
            limit: 30
            interval: '1 hour'
        # Background uploads of the import form (#977): every file selection, including replaced files.
        import_upload:
            policy: fixed_window
            limit: 60
            interval: '1 hour'
        allocations_export:
            policy: fixed_window
            limit: 10
            interval: '10 minutes'
        analysis_explorer_export:
            policy: fixed_window
            limit: 20
            interval: '10 minutes'
        top_lists_export:
            policy: fixed_window
            limit: 20
            interval: '10 minutes'
        closure_analytics_export:
            policy: fixed_window
            limit: 20
            interval: '10 minutes'
        # Notification polling (ADR 016): one poll every 30-60 s per active tab plus page loads.
        notification_poll:
            policy: sliding_window
            limit: 30
            interval: '1 minute'

when@test:
    framework:
        rate_limiter:
            explore_list:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            feedback_submit:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            feedback_submit_anonymous_ip:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            feedback_submit_anonymous_email:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            transactional_mail:
                policy: sliding_window
                limit: 1000
                interval: '1 second'
            register:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            reset_password_request:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            import_create:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            import_upload:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            allocations_export:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            analysis_explorer_export:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            top_lists_export:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            closure_analytics_export:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
