        rate_limiter:
            explore_list:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            feedback_submit:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            feedback_submit_anonymous_ip:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            feedback_submit_anonymous_email:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            transactional_mail:
                policy: sliding_window
                limit: 1000
                interval: '1 second'
            register:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            reset_password_request:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            import_create:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            allocations_export:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
            analysis_explorer_export:
                policy: fixed_window
                limit: 10000
                interval: '1 second'
