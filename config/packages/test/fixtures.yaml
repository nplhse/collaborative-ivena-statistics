parameters:
    # Multiplies the allocations per day (0.01–10); 1 is close to real volumes, 0.1 loads fast.
    env(FIXTURES_SCALE): '1'
    fixtures.scale: '%env(float:FIXTURES_SCALE)%'

    fixtures.baseline:
        # Participating hospitals that receive synthetic allocations (the demo hospital is always one of them).
        hospitals_active: 3
        # Whole months before the current one; in October 2026, 12 means 1 October 2025 until yesterday.
        months: 1
        # Average allocations per hospital and day by hospital size (coarse, rounded from real volumes).
        allocations_per_day:
            Small: 2
            Medium: 3
            Large: 5
        mci_cases: 3
        seed: 740
        rebuild_projection: true
