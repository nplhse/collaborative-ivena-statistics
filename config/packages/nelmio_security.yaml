nelmio_security:
    clickjacking:
        paths:
            '^/.*': DENY

    content_type:
        nosniff: true

    referrer_policy:
        enabled: true
        policies:
            - 'no-referrer'
            - 'strict-origin-when-cross-origin'

    permissions_policy:
        enabled: true
        policies:
            geolocation: []
            microphone: []
            camera: []

when@prod:
    nelmio_security:
        forced_ssl:
            enabled: true
            hsts_max_age: 31536000
            hsts_subdomains: true
            hsts_preload: false
        csp:
            # Enforced since #580; violations are still reported to Sentry through report-uri
            # (docs/05-operations/content-security-policy.md). style-src-attr is appended by StyleAttributePolicyListener
            # (ADR 047), because Nelmio 3.9 does not know it.
            enforce:
                default-src: ["'self'"]
                base-uri: ["'self'"]
                object-src: ["'none'"]
                script-src: ["'self'", "'unsafe-inline'", "data:"]
                style-src: ["'self'", "'unsafe-inline'"]
                img-src: ["'self'", "data:", "https://*.tile.openstreetmap.org"]
                font-src: ["'self'", "data:"]
                connect-src: ["'self'", "https://*.tile.openstreetmap.org", "https://*.ingest.sentry.io"]
                form-action: ["'self'"]
                frame-ancestors: ["'none'"]
                # Read at runtime; nelmio drops the directive when the variable is empty.
                report-uri: ['%env(trim:SENTRY_CSP_REPORT_URI)%']
