# Maps dispatch-area geo keys to one or more official Kreis geometries (merged on the map).
# Source: BKG VG250 via Opendatasoft georef-germany-kreis.
#   - Hessen: assets/geo/.source/hessen-kreise-raw.geojson (lan_name = Hessen, year 2023)
#   - Neighbouring dispatch areas: assets/geo/.source/neighbour-kreise-raw.geojson (year 2025)
#
# Entries without `state` belong to `core_state`. Entries with another state are neighbouring
# dispatch areas outside Hesse: drawn in a distinct style, they do not set the default map view.
# Each neighbouring entry lists the official district keys (AGS) in `krs_codes`, in the order of
# `krs_names`; the build checks them against the raw data. Coverage sources are cited per entry.
core_state: Hessen
dispatch_areas:
    bergstrasse:
        name: Bergstraße
        krs_names:
            - Landkreis Bergstraße
    darmstadt:
        name: Darmstadt
        krs_names:
            - Kreisfreie Stadt Darmstadt
    darmstadt-dieburg:
        name: Darmstadt-Dieburg
        krs_names:
            - Landkreis Darmstadt-Dieburg
    frankfurt:
        name: Frankfurt
        krs_names:
            - Kreisfreie Stadt Frankfurt am Main
    fulda:
        name: Fulda
        krs_names:
            - Landkreis Fulda
    giessen:
        name: Gießen
        krs_names:
            - Landkreis Gießen
    gross-gerau:
        name: Groß-Gerau
        krs_names:
            - Landkreis Groß-Gerau
    hersfeld-rotenburg:
        name: Hersfeld-Rotenburg
        krs_names:
            - Landkreis Hersfeld-Rotenburg
    hochtaunus:
        name: Hochtaunus
        krs_names:
            - Landkreis Hochtaunuskreis
    kassel:
        name: Kassel
        krs_names:
            - Kreisfreie Stadt Kassel
            - Landkreis Kassel
    lahn-dill:
        name: Lahn-Dill
        krs_names:
            - Landkreis Lahn-Dill-Kreis
    limburg-weilburg:
        name: Limburg-Weilburg
        krs_names:
            - Landkreis Limburg-Weilburg
    main-kinzig:
        name: Main-Kinzig
        krs_names:
            - Landkreis Main-Kinzig-Kreis
    main-taunus:
        name: Main-Taunus
        krs_names:
            - Landkreis Main-Taunus-Kreis
    marburg-biedenkopf:
        name: Marburg-Biedenkopf
        krs_names:
            - Landkreis Marburg-Biedenkopf
    odenwald:
        name: Odenwald
        krs_names:
            - Landkreis Odenwaldkreis
    offenbach:
        name: Offenbach
        krs_names:
            - Kreisfreie Stadt Offenbach am Main
            - Landkreis Offenbach
    rheingau-taunus:
        name: Rheingau Taunus
        krs_names:
            - Landkreis Rheingau-Taunus-Kreis
    schwalm-eder:
        name: Schwalm-Eder
        krs_names:
            - Landkreis Schwalm-Eder-Kreis
    vogelsberg:
        name: Vogelsberg
        krs_names:
            - Landkreis Vogelsbergkreis
    waldeck-frankenberg:
        name: Waldeck-Frankenberg
        krs_names:
            - Landkreis Waldeck-Frankenberg
    werra-meissner:
        name: Werra-Meißner
        krs_names:
            - Landkreis Werra-Meißner-Kreis
    wetterau:
        name: Wetterau
        krs_names:
            - Landkreis Wetteraukreis
    wiesbaden:
        name: Wiesbaden
        krs_names:
            - Kreisfreie Stadt Wiesbaden
    # Leitstelle Göttingen: Landkreis Göttingen incl. the city of Göttingen and the former
    # Landkreis Osterode am Harz (merged 2016). Landtag Niedersachsen, Drucksache 19/6425.
    goettingen:
        name: Göttingen
        state: Niedersachsen
        krs_names:
            - Landkreis Göttingen
        krs_codes:
            - '03159'
    # Integrierte Einsatzleitstelle Landkreis Northeim. landkreis-northeim.de (Einsatzleitstelle).
    northeim:
        name: Northeim
        state: Niedersachsen
        krs_names:
            - Landkreis Northeim
        krs_codes:
            - '03155'
    # Zentrale Rettungsleitstelle Landkreis Eichsfeld. kreis-eic.de (Zentrale Rettungsleitstelle).
    eichsfeld:
        name: Eichsfeld
        state: Thüringen
        krs_names:
            - Landkreis Eichsfeld
        krs_codes:
            - '16061'
    # ILS Schweinfurt: city and district of Schweinfurt, Haßberge, Bad Kissingen, Rhön-Grabfeld.
    # The ILS area is the rescue service area under the BayRDG (Art. 1 BayILSG).
    schweinfurt:
        name: Schweinfurt
        state: Bayern
        krs_names:
            - Kreisfreie Stadt Schweinfurt
            - Landkreis Schweinfurt
            - Landkreis Haßberge
            - Landkreis Bad Kissingen
            - Landkreis Rhön-Grabfeld
        krs_codes:
            - '09662'
            - '09678'
            - '09674'
            - '09672'
            - '09673'
    # ILS Bayerischer Untermain (ZRF Bayerischer Untermain): city and district of Aschaffenburg,
    # Landkreis Miltenberg. The stored dispatch-area name is only known after the first import
    # from this area; check the entry in dispatch_area_geo_map.yaml then (#1404).
    bayerischer-untermain:
        name: Bayerischer Untermain
        state: Bayern
        krs_names:
            - Kreisfreie Stadt Aschaffenburg
            - Landkreis Aschaffenburg
            - Landkreis Miltenberg
        krs_codes:
            - '09661'
            - '09671'
            - '09676'
