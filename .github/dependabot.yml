# Dependabot configuration for Gitflow (ADR 024).
# Version updates go to `develop`. Security updates always target the default
# branch (`main`) and cannot be redirected with `target-branch`, so each
# ecosystem has a second entry without `target-branch` that only exists to
# label and prefix those security pull requests as hotfix candidates.
# Options of an entry with `target-branch` do not apply to security updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
    # Composer: version updates into develop
    - package-ecosystem: "composer"
      directory: "/"
      target-branch: "develop"
      schedule:
          interval: "weekly"
          day: "sunday"
      open-pull-requests-limit: 10
      groups:
          symfony:
              patterns:
                  - "symfony/*"
          doctrine:
              patterns:
                  - "doctrine/*"
          phpstan:
              patterns:
                  - "phpstan/*"
          psalm:
              patterns:
                  - "vimeo/psalm"
                  - "psalm/*"
                  - "weirdan/doctrine-psalm-plugin"
      ignore:
          - dependency-name: "roave/security-advisories"

    # Composer: security updates only, against main (limit 0 disables version updates)
    - package-ecosystem: "composer"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "sunday"
      open-pull-requests-limit: 0
      labels:
          - "dependencies"
          - "security"
          - "hotfix"
      commit-message:
          prefix: "fix(security)"
      ignore:
          - dependency-name: "roave/security-advisories"

    # npm (JS dev tooling): version updates into develop
    - package-ecosystem: "npm"
      directory: "/"
      target-branch: "develop"
      schedule:
          interval: "weekly"
          day: "sunday"
      groups:
          eslint:
              patterns:
                  - "eslint"
                  - "@eslint/*"
                  - "eslint-config-prettier"
                  - "globals"
                  - "prettier"

    # npm: security updates only, against main (limit 0 disables version updates)
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "sunday"
      open-pull-requests-limit: 0
      labels:
          - "dependencies"
          - "security"
          - "hotfix"
      commit-message:
          prefix: "fix(security)"

    # GitHub Actions: version updates into develop. Workflows pin actions to a commit SHA with
    # the release as a comment (`@<sha> # v1.2.3`); Dependabot updates both. Pinned actions get
    # an update for every release, so all of them go into one weekly pull request.
    - package-ecosystem: "github-actions"
      directory: "/"
      target-branch: "develop"
      schedule:
          interval: "weekly"
          day: "sunday"
      groups:
          github-actions:
              patterns:
                  - "*"
