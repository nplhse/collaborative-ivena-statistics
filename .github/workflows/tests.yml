name: Testsuite

on:
    push:
        branches: [main]
        paths-ignore:
            - 'docs/**'
            - '**.md'
    pull_request:
        paths-ignore:
            - 'docs/**'
            - '**.md'

# Cancel superseded runs on PR branches. On main every run gets its own group,
# so no push is cancelled or dropped from the queue.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    prod-smoke:
        name: Prod kernel smoke
        runs-on: ubuntu-latest
        env:
            APP_ENV: prod
            APP_DEBUG: 0
            APP_SECRET: ci-test-placeholder-not-for-production
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  extensions: "intl, mbstring, zip"
                  php-version: '8.4'
                  tools: composer:v2

            # Keeps the Composer scripts: cache:clear boots the prod kernel, importmap:install fetches the JS vendors.
            - name: Install production dependencies
              uses: ramsey/composer-install@v4
              with:
                  composer-options: --no-dev

            - name: Lint the prod container
              run: php bin/console lint:container

            - name: Compile assets
              run: php bin/console asset-map:compile

    unit:
        name: Unit tests
        runs-on: ubuntu-latest
        env:
            APP_SECRET: ci-test-placeholder-not-for-production
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  extensions: "intl, mbstring, zip"
                  php-version: '8.4'
                  tools: composer:v2

            # No Composer scripts: cache:clear would build a dev container the tests never use (~16 s).
            - name: Install dependencies
              uses: ramsey/composer-install@v4
              with:
                  composer-options: --no-scripts

            # Same command as `make test-unit` locally; COVERAGE and JUNIT write the files uploaded below.
            - name: Execute unit tests via ParaTest
              run: make -s test-unit COVERAGE=1 JUNIT=1

            - name: Upload unit coverage artifact
              if: success()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-unit
                  path: var/coverage/logs/clover-unit.xml
                  if-no-files-found: error

            - name: Upload unit test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  report_type: test_results
                  files: junit-unit.xml
                  name: unit-test-results
                  disable_search: true
                  fail_ci_if_error: false

    database:
        name: Database tests
        runs-on: ubuntu-latest
        env:
            APP_SECRET: ci-test-placeholder-not-for-production
            SYMFONY_DEPRECATIONS_HELPER: 'max[total]=0&verbose=1'
        services:
            postgres:
                image: postgres:18
                ports:
                    - 5432:5432
                env:
                    POSTGRES_DB: app
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: password
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  coverage: pcov
                  extensions: "intl, mbstring, pdo_pgsql, zip"
                  php-version: '8.4'
                  tools: composer:v2

            # No Composer scripts: cache:clear would build a dev container the tests never use (~16 s).
            - name: Install dependencies
              uses: ramsey/composer-install@v4
              with:
                  composer-options: --no-scripts

            - name: Build and compile assets
              run: |
                  php bin/console assets:install public
                  php bin/console importmap:install
                  php bin/console asset-map:compile

            - name: Warm test cache
              run: php bin/console cache:warmup --env=test

            # Same command as `make test-database` locally; COVERAGE and JUNIT write the files uploaded below.
            - name: Execute database-backed tests via ParaTest
              run: |
                  make -s test-database COVERAGE=1 JUNIT=1
                  php bin/report-slowest-tests 10 || true
              env:
                  DATABASE_URL: postgres://app:password@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/app

            - name: Upload integration coverage artifact
              if: success()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-integration
                  path: var/coverage/logs/clover-integration.xml
                  if-no-files-found: error

            - name: Upload integration test results to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  report_type: test_results
                  files: junit-integration.xml
                  name: integration-test-results
                  disable_search: true
                  fail_ci_if_error: false

    # Single unflagged coverage upload (unit + integration clovers).
    # Dual per-job flagged uploads since #346 stayed stuck in Codecov "started".
    coverage:
        name: Upload coverage to Codecov
        needs: [unit, database]
        runs-on: ubuntu-latest
        if: success()
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Download unit coverage
              uses: actions/download-artifact@v8
              with:
                  name: coverage-unit
                  path: var/coverage/logs

            - name: Download integration coverage
              uses: actions/download-artifact@v8
              with:
                  name: coverage-integration
                  path: var/coverage/logs

            - name: Upload combined coverage to Codecov
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: var/coverage/logs/clover-unit.xml,var/coverage/logs/clover-integration.xml
                  name: unit-and-integration
                  disable_search: true
                  fail_ci_if_error: true
                  verbose: true
