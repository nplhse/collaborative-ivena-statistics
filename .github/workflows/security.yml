name: Security Scan

on:
    push:
        branches: [ "main", "develop" ]
        paths-ignore:
            - 'docs/**'
            - '**.md'
    # Docs-only pull requests run the workflow; the code jobs are skipped through the changes job (#1183).
    pull_request:
    schedule:
        - cron: '33 20 * * 5'

# Cancel superseded runs on PR branches. On main and develop every run gets its own
# group, so no push is cancelled or dropped from the queue.
concurrency:
    group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.run_id || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    changes:
        uses: ./.github/workflows/changes.yml
        permissions:
            contents: read
            pull-requests: read

    php-security:
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read # for actions/checkout to fetch code
            security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
            actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install PHP
              uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
              with:
                  coverage: none
                  extensions: intl
                  php-version: '8.4'
                  tools: composer:v2

            # Same Psalm version and psalm.xml as `make psalm` (no separate Docker image with its own version).
            - name: Install dependencies
              uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
              with:
                  composer-options: --no-scripts

            - name: Psalm taint analysis
              run: make -s security SARIF=results.sarif

            # Upload findings also when Psalm fails because of them.
            - name: Upload Security Analysis results to GitHub
              if: ${{ !cancelled() && hashFiles('results.sarif') != '' }}
              uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  sarif_file: results.sarif
