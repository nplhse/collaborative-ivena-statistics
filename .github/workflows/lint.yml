name: "Linting"

on:
    pull_request:
        paths-ignore:
            - 'docs/**'
            - '**.md'
    push:
        branches:
            - main
        paths-ignore:
            - 'docs/**'
            - '**.md'

# Cancel superseded runs on PR branches. On main every run gets its own group,
# so no push is cancelled or dropped from the queue.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    linters:
        name: Linters
        runs-on: ubuntu-latest
        env:
            # Required for Symfony console/PHPStan (no .env.local in CI). Not a production secret.
            APP_SECRET: ci-lint-placeholder-not-for-production
            # PHPStan boots Doctrine via tests/object-manager.php; CI has no PostgreSQL service.
            DATABASE_URL: 'sqlite:///${{ github.workspace }}/var/lint.db'
            MESSENGER_TRANSPORT_DSN: sync://
            SYMFONY_DEPRECATIONS_HELPER: 'max[total]=0&verbose=1'
            # The Makefile defaults to the Symfony CLI, which the runner does not have.
            CONSOLE: php bin/console

        # Each check runs as its own step in the order of `make lint` (see Makefile). Every check runs
        # even if an earlier one failed, so one run lists all problems; setup failures skip the checks.
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install PHP with extensions
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  extensions: intl, pdo_sqlite
                  php-version: '8.4'
                  tools: composer:v2

            # No Composer scripts: their cache:clear would build the dev container here; the phpstan target
            # builds it when needed.
            - name: Install dependencies
              id: composer
              uses: ramsey/composer-install@v4
              with:
                  composer-options: --no-scripts

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22.x'
                  cache: npm

            - name: Install npm dependencies
              id: npm
              run: npm ci

            # Tool caches: key changes with the lock file and the tool configs; restore takes the newest
            # cache with the same prefix. Measured in #830: Lint 235 s → 54 s with a warm cache.
            - name: Restore analysis caches
              uses: actions/cache/restore@v6
              with:
                  path: |
                      var/cache/rector
                      var/cache/phpstan
                      var/cache/psalm
                      .php-cs-fixer.cache
                      .twig-cs-fixer.cache
                  key: lint-${{ runner.os }}-${{ hashFiles('composer.lock', 'rector.php', 'phpstan.dist.neon', 'phpstan-baseline.neon', 'psalm.xml', '.php-cs-fixer.dist.php', '.twig-cs-fixer.dist.php') }}-${{ github.run_id }}
                  restore-keys: |
                      lint-${{ runner.os }}-${{ hashFiles('composer.lock', 'rector.php', 'phpstan.dist.neon', 'phpstan-baseline.neon', 'psalm.xml', '.php-cs-fixer.dist.php', '.twig-cs-fixer.dist.php') }}-

            - name: Check PHPUnit suite directories
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s check-phpunit-suite-dirs

            - name: Lint Composer config
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s composer-validate

            - name: Check if any dependencies are compromised
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              # CI only: needs the network, so it has no make target.
              run: composer audit

            - name: Check for git merge conflicts
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s check-conflicts

            - name: Lint YAML files
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s lint-yaml

            - name: Check Symfony deprecations and lint the container
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s lint-container

            - name: Lint XLIFF translation files
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s lint-xliff

            - name: Lint translation contents
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s lint-trans

            - name: Lint Twig template syntax
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s lint-templates

            - name: Check for commented-out code and non-final classes
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s swiss-knife-check

            - name: Check Rector
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s rector-check

            - name: Lint PHP code style (PHP-CS-Fixer)
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s lint-php

            - name: Lint Twig code style (twig-cs-fixer)
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s lint-twig

            - name: Lint JavaScript (Prettier + ESLint)
              if: ${{ !cancelled() && steps.composer.outcome == 'success' && steps.npm.outcome == 'success' }}
              run: make -s lint-js

            - name: Run PHPStan
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s phpstan

            - name: Run Psalm
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s psalm

            - name: Run Deptrac (architecture report, does not fail)
              if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
              run: make -s deptrac

            - name: Save analysis caches
              if: ${{ !cancelled() }}
              uses: actions/cache/save@v6
              with:
                  path: |
                      var/cache/rector
                      var/cache/phpstan
                      var/cache/psalm
                      .php-cs-fixer.cache
                      .twig-cs-fixer.cache
                  key: lint-${{ runner.os }}-${{ hashFiles('composer.lock', 'rector.php', 'phpstan.dist.neon', 'phpstan-baseline.neon', 'psalm.xml', '.php-cs-fixer.dist.php', '.twig-cs-fixer.dist.php') }}-${{ github.run_id }}
